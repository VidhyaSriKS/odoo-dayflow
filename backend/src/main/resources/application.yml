server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: dayflow-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:dayflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

dayflow:
  jwt:
    secret: ${JWT_SECRET:dayflow_super_secret_jwt_key_2026_hackathon_production_secure_key_987654321}
    expiration-ms: 86400000 # 24 Hours

  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.dayflow: DEBUG
    org.springframework.security: INFO
