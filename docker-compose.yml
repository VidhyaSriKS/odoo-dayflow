version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dayflow-postgres
    environment:
      POSTGRES_DB: dayflow_db
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow_secret_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dayflow_db
      SPRING_DATASOURCE_USERNAME: dayflow
      SPRING_DATASOURCE_PASSWORD: dayflow_secret_pass
      JWT_SECRET: dayflow_super_secret_jwt_key_2026_hackathon_production_secure_key_987654321
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dayflow-ai-service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dayflow-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_AI_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
